<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Panellets</title>
<style>
/* panellets — superfícies planes, zero radi, etiquetes petites en minúscula
   i un títol enorme. El color només el posen els panellets: cada tipus és un
   bloc pintat del seu color, i cada any es dibuixa com una safata, un punt
   per panellet. */
:root {
  --bg: #F3F3F1; --surface: #E7E7E4; --line: #CDCDC8; --text: #222221; --muted: #76766F;
  --k-coco: #ECE5D3; --i-coco: #222221;
  --k-xocolata: #4F3122; --i-xocolata: #F3ECE4;
  --k-ametlles: #C4884E; --i-ametlles: #1D150E;
  --k-pinyons: #E2B547; --i-pinyons: #1E190C;
  --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --gap: clamp(28px, 5vw, 72px);
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #161616; --surface: #1F1F1F; --line: #333333; --text: #D6D6D6; --muted: #7E7E7E;
  --k-xocolata: #835136; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #161616; --surface: #1F1F1F; --line: #333333; --text: #D6D6D6; --muted: #7E7E7E;
  --k-xocolata: #835136; color-scheme: dark }

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.6 var(--mono);
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
main { max-width: 860px; margin: 0 auto; padding-block: var(--gap) calc(var(--gap) * 2); display: grid; gap: calc(var(--gap) * 1.5); }
h1, h2, p { margin: 0; font-weight: 400; }
h1 { font-size: clamp(56px, 17vw, 168px); line-height: .85; letter-spacing: -.06em; margin-left: -.04em; }
h2 { font-size: clamp(40px, 10vw, 96px); line-height: .9; letter-spacing: -.05em; font-variant-numeric: tabular-nums; }
.label { font-size: 11px; color: var(--muted); text-transform: lowercase; letter-spacing: .04em; }
section { display: grid; gap: 20px; }
button { font: inherit; color: inherit; background: none; border: 1px solid currentColor; padding: 2px 10px; cursor: pointer; }
button:hover { background: var(--text); color: var(--bg); border-color: var(--text); }
:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }

/* els blocs de cada tipus */
.clips { display: grid; grid-template-columns: repeat(4, 1fr); gap: 2px; }
@media (max-width: 560px) { .clips { grid-template-columns: repeat(2, 1fr); } }
.clip { background: var(--k); color: var(--i); padding: 12px; display: grid; gap: 4px; min-width: 0; }
.clip .label { color: inherit; opacity: .75; }
.clip input { font: inherit; font-size: clamp(32px, 6vw, 48px); line-height: 1; letter-spacing: -.04em; color: inherit;
  background: none; border: 0; padding: 0; width: 100%; font-variant-numeric: tabular-nums; -moz-appearance: textfield; }
.clip input::-webkit-inner-spin-button, .clip input::-webkit-outer-spin-button { -webkit-appearance: none; margin: 0; }
.clip .steps { display: flex; gap: 6px; }
.clip button:hover { background: var(--i); color: var(--k); border-color: var(--i); }

/* la safata: un punt per panellet */
.tray { display: flex; flex-wrap: wrap; gap: 4px; }
.tray i { width: 11px; height: 11px; border-radius: 50%; background: var(--k); box-shadow: inset 0 0 0 1px rgb(0 0 0 / .12); }
.total { display: flex; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.total strong { font-size: 32px; font-weight: 400; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }

.shop { display: grid; grid-template-columns: max-content 1fr; gap: 2px 20px; margin: 0; border-top: 1px solid var(--line); padding-top: 16px; }
.shop dt { text-align: right; font-variant-numeric: tabular-nums; }
.shop dd { margin: 0; min-width: 0; }
.shop small { color: var(--muted); }
.row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }

.year { display: grid; gap: 20px; border-top: 1px solid var(--line); padding-top: 20px; }
.year header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
.diary { white-space: pre-wrap; overflow-wrap: anywhere; background: var(--surface); padding: 20px; max-width: 64ch; }
.error { color: var(--k-xocolata); }
@media (prefers-reduced-motion: no-preference) { .tray i { transition: background-color .3s; } }
</style>
</head>
<body>
<main>
  <h1>panellets</h1>

  <section aria-labelledby="calc-title">
    <p class="label" id="calc-title">quants en farem?</p>
    <form id="calc">
      <div class="clips" id="kinds"></div>
    </form>
    <div class="total"><strong id="total"></strong><span class="label" id="basis"></span></div>
    <div class="tray" id="tray"></div>
    <dl class="shop" id="shop"></dl>
    <div class="row">
      <span class="label" id="copied" aria-live="polite"></span>
      <button type="button" id="copy">copiar la llista</button>
    </div>
  </section>

  <section id="years"></section>
</main>

<script>
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]);
const sum = (o) => Object.values(o).reduce((a, b) => a + b, 0);
const nf = (n) => n.toLocaleString('ca', { maximumFractionDigits: 2 });
const paint = (k) => `--k:var(--k-${esc(k)}, var(--muted));--i:var(--i-${esc(k)}, var(--bg))`;

// La massa (sense "kind") va amb el total; cada cobertura, amb els seus.
function calc(year, want) {
  const all = sum(want) / sum(year.kinds);
  return year.ingredients.map((i) => ({ ...i, amount: i.amount * (i.kind ? (want[i.kind] || 0) / year.kinds[i.kind] : all) }));
}

function qty({ amount, unit }) {
  if (unit === 'g') { const g = Math.ceil(amount / 10) * 10; return g >= 1000 ? nf(g / 1000) + ' kg' : g + ' g'; }
  if (unit === 'u') return String(Math.ceil(amount));
  return nf(Math.ceil(amount * 2) / 2) + (unit ? ' ' + unit : '');
}

const tray = (kinds) => Object.entries(kinds).map(([k, n]) => `<i style="${paint(k)}"></i>`.repeat(n)).join('');
const trayLabel = (kinds) => Object.entries(kinds).map(([k, n]) => `${n} de ${k}`).join(', ');

function renderYear(y) {
  return `<article class="year" id="any-${y.year}">
    <header><h2>${y.year}</h2><span class="label">${sum(y.kinds)} panellets</span></header>
    <div class="tray" role="img" aria-label="${esc(trayLabel(y.kinds))}">${tray(y.kinds)}</div>
    <div class="diary">${esc((y.diary || []).join('\n'))}</div>
  </article>`;
}

fetch('data/years.json').then((r) => r.json()).then((years) => {
  years.sort((a, b) => b.year - a.year);
  const last = years[0];
  console.assert(calc(last, last.kinds).every((r, i) => Math.abs(r.amount - last.ingredients[i].amount) < 1e-9), 'calc: amb els mateixos panellets ha de sortir la mateixa recepta');

  $('kinds').innerHTML = Object.entries(last.kinds).map(([k, n]) => `<div class="clip" style="${paint(k)}">
      <label class="label" for="k-${esc(k)}">${esc(k)}</label>
      <input type="number" id="k-${esc(k)}" data-kind="${esc(k)}" min="0" step="5" inputmode="numeric" value="${n}">
      <div class="steps"><button type="button" data-step="-5" aria-label="5 menys de ${esc(k)}">−5</button><button type="button" data-step="5" aria-label="5 més de ${esc(k)}">+5</button></div>
    </div>`).join('');
  $('basis').textContent = `proporcions del ${last.year}, arrodonit cap amunt`;

  let text = '';
  const update = () => {
    const want = {};
    $('kinds').querySelectorAll('input').forEach((el) => { want[el.dataset.kind] = Math.max(0, Math.round(+el.value) || 0); });
    const rows = calc(last, want).filter((r) => r.amount > 0);
    $('total').textContent = `${sum(want)} panellets`;
    $('tray').innerHTML = tray(want);
    $('tray').setAttribute('role', 'img');
    $('tray').setAttribute('aria-label', trayLabel(want));
    $('shop').innerHTML = rows.map((r) => `<dt>${esc(qty(r))}</dt><dd>${esc(r.name)}${r.note ? ` <small>· ${esc(r.note)}</small>` : ''}</dd>`).join('')
      + (last.extras || []).map((e) => `<dt>+</dt><dd>${esc(e)}</dd>`).join('');
    text = rows.map((r) => `${qty(r)} ${r.name}${r.note ? ` (${r.note})` : ''}`).concat(last.extras || []).join('\n');
    $('copied').textContent = '';
  };
  $('calc').addEventListener('input', update);
  $('calc').addEventListener('submit', (e) => e.preventDefault());
  $('calc').addEventListener('click', (e) => {
    const b = e.target.closest('[data-step]');
    if (!b) return;
    const input = b.closest('.clip').querySelector('input');
    input.value = Math.max(0, (+input.value || 0) + +b.dataset.step);
    update();
  });
  update();

  $('copy').addEventListener('click', () => {
    navigator.clipboard.writeText('panellets\n' + text)
      .then(() => { $('copied').textContent = 'copiada'; })
      .catch(() => { getSelection().selectAllChildren($('shop')); $('copied').textContent = 'seleccionada: copia-la tu'; });
  });

  $('years').innerHTML = years.map(renderYear).join('');
}).catch(() => {
  $('years').innerHTML = '<p class="error">no s\'ha pogut llegir data/years.json. mira si hi falta una coma.</p>';
});
</script>
</body>
</html>
